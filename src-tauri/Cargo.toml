[package]
name = "mosh"
version.workspace = true
description = "MOSH — local-first personal information hub"
authors.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mosh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
mosh-core = { path = "../crates/mosh-core" }
# 审批闸门的 oneshot 通道与等待超时轮询（select! 宏需 macros；运行时由 tauri::async_runtime 提供）。
tokio = { version = "1", features = ["sync", "time", "macros"] }
# 自动更新：检测 GitHub Release 新版本并下载安装（process 提供 relaunch 重启）。
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# 系统通知：日程提醒/待办到期时经 OS 通知中心告知（应用内 Toast 之外的补充）。
tauri-plugin-notification = "2"
# 单实例锁：重复点击桌面图标时新进程立即退出并唤起已有实例主窗口（配合后台驻留模式）。
tauri-plugin-single-instance = "2"
# 启动期配置文件（config.toml，自定义数据目录等）。
toml = "0.8"
# 邮件通知（SMTP 直发）：rustls 纯 Rust TLS 栈（与 sync/agent 一致，规避 OpenSSL），
# tokio 异步执行（运行时由 tauri::async_runtime 提供）。
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
