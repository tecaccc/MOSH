[package]
name = "mosh-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "MOSH shared core: domain model, SQLite storage, services."

[lib]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
rusqlite = { version = "0.31", features = ["bundled"] }
rusqlite_migration = "1"
# HTTP 客户端：rustls-tls（纯 Rust TLS）规避 windows-gnu 交叉编译的 OpenSSL 依赖。
# stream：agent 模块的 SSE 流式解析需要 bytes_stream。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"

[dev-dependencies]
# 测试用 async 执行器（agent 循环单测）；生产代码运行时由 src-tauri 注入。
tokio = { version = "1", features = ["macros", "rt"] }
