[workspace]
resolver = "2"
members = ["src-tauri", "crates/mosh-core"]

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["MOSH"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7"] }
thiserror = "1"
